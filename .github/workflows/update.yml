name: Actualizar MercadoAR

on:
  schedule:
    - cron: '0 10 * * 1-5'
    - cron: '0 13 * * 1-5'
    - cron: '0 16 * * 1-5'
    - cron: '30 21 * * 1-5'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install yfinance feedparser
      - run: python update_prices.py
      - run: python update_news.py
      - run: python notify_discord.py
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      - run: |
          git config user.name "actions"
          git config user.email "actions@github.com"
          git add data.json news.json
          git commit -m "Auto update" || true
          git push
