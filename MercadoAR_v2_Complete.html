<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MercadoAR · Trading Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --bg-primary: #0a0a12;
            --bg-secondary: #12121f;
            --bg-tertiary: #1a1a2e;
            --border-color: rgba(255, 255, 255, 0.06);
            --text-primary: #e8e8f0;
            --text-secondary: #a8a8b8;
            --accent: #14b8a6;
            --accent-glow: rgba(20, 184, 166, 0.3);
            --success: #22c55e;
            --warning: #f59e0b;
            --danger: #ef4444;
            --danger-glow: rgba(239, 68, 68, 0.3);
            --success-glow: rgba(34, 197, 94, 0.3);
            
            --font-sans: 'Geist', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }
        
        html[data-theme="light"] {
            --bg-primary: #f8f8fa;
            --bg-secondary: #ffffff;
            --bg-tertiary: #f0f0f5;
            --border-color: rgba(0, 0, 0, 0.08);
            --text-primary: #1a1a2e;
            --text-secondary: #6e6e88;
        }
        
        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: var(--font-sans);
            font-size: 14px;
            line-height: 1.5;
            overflow: hidden;
        }
        
        .app {
            display: flex;
            height: 100vh;
            flex-direction: column;
        }
        
        /* ─── HEADER ─── */
        .header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            padding: 14px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            flex-wrap: wrap;
        }
        
        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        
        .logo {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .logo-icon {
            width: 24px;
            height: 24px;
            background: linear-gradient(135deg, var(--accent), #06b6d4);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: white;
            font-weight: bold;
        }
        
        .connection-status {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            background: rgba(0,0,0,0.2);
            border-radius: 6px;
            font-size: 12px;
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-secondary);
            animation: pulse 2s infinite;
        }
        
        .status-dot.connected {
            background: var(--success);
        }
        
        .status-dot.connecting {
            background: var(--warning);
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .header-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 12px;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border-color);
            border-radius: 6px;
        }
        
        .control-group label {
            font-size: 12px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 500;
        }
        
        select, input[type="checkbox"] {
            background: var(--bg-secondary);
            color: var(--text-primary);
            border: none;
            border-radius: 4px;
            padding: 6px 10px;
            font-family: var(--font-mono);
            font-size: 13px;
            cursor: pointer;
        }
        
        select:hover, input[type="checkbox"]:hover {
            background: var(--bg-tertiary);
        }
        
        .btn {
            padding: 8px 16px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: 500;
            font-size: 13px;
            transition: all 0.2s;
            font-family: var(--font-sans);
        }
        
        .btn-primary {
            background: var(--accent);
            color: white;
            box-shadow: 0 0 20px rgba(20, 184, 166, 0.2);
        }
        
        .btn-primary:hover {
            background: #0fa898;
            box-shadow: 0 0 30px var(--accent-glow);
            transform: translateY(-1px);
        }
        
        .btn-primary.running {
            animation: pulse-btn 1.5s infinite;
        }
        
        @keyframes pulse-btn {
            0%, 100% { box-shadow: 0 0 20px var(--accent-glow); }
            50% { box-shadow: 0 0 40px var(--accent-glow); }
        }
        
        .btn-secondary {
            background: rgba(255,255,255,0.08);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }
        
        .btn-secondary:hover {
            background: rgba(255,255,255,0.12);
            border-color: var(--accent);
        }
        
        /* ─── MAIN CONTENT ─── */
        .main {
            display: flex;
            flex: 1;
            overflow: hidden;
            gap: 0;
        }
        
        .main-left {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            overflow-x: hidden;
        }
        
        .main-right {
            width: 320px;
            background: var(--bg-secondary);
            border-left: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        /* ─── CARDS ─── */
        .card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
            margin: 12px;
            margin-bottom: 0;
        }
        
        .card-title {
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-secondary);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        /* ─── PREDICTIONS ─── */
        .predictions-card {
            flex: 0 0 auto;
            max-height: 320px;
            overflow-y: auto;
        }
        
        .prediction {
            background: linear-gradient(135deg, rgba(20,184,166,0.08) 0%, rgba(20,184,166,0.03) 100%);
            border: 1px solid rgba(20,184,166,0.2);
            border-left: 4px solid var(--accent);
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .prediction.sell {
            border-left-color: var(--danger);
            background: linear-gradient(135deg, rgba(239,68,68,0.08) 0%, rgba(239,68,68,0.03) 100%);
            border-color: rgba(239,68,68,0.2);
        }
        
        .prediction.watch {
            border-left-color: var(--warning);
            background: linear-gradient(135deg, rgba(245,158,11,0.08) 0%, rgba(245,158,11,0.03) 100%);
            border-color: rgba(245,158,11,0.2);
        }
        
        .prediction-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        
        .prediction-signal {
            font-weight: 600;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .prediction-signal.buy { color: var(--success); }
        .prediction-signal.sell { color: var(--danger); }
        .prediction-signal.watch { color: var(--warning); }
        
        .prediction-ticker {
            font-family: var(--font-mono);
            font-weight: 700;
            font-size: 12px;
            background: rgba(20,184,166,0.15);
            padding: 2px 6px;
            border-radius: 4px;
        }
        
        .prediction-body {
            font-size: 12px;
            color: var(--text-secondary);
            line-height: 1.4;
        }
        
        .prediction-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 8px;
            border-top: 1px solid rgba(255,255,255,0.05);
            font-size: 11px;
            color: var(--text-secondary);
        }
        
        .prediction-actions {
            display: flex;
            gap: 6px;
        }
        
        .btn-check {
            flex: 1;
            padding: 5px 8px;
            font-size: 11px;
            background: rgba(34,197,94,0.15);
            color: var(--success);
            border: 1px solid rgba(34,197,94,0.3);
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .btn-check:hover {
            background: rgba(34,197,94,0.25);
            border-color: var(--success);
        }
        
        .btn-cross {
            flex: 1;
            padding: 5px 8px;
            font-size: 11px;
            background: rgba(239,68,68,0.15);
            color: var(--danger);
            border: 1px solid rgba(239,68,68,0.3);
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .btn-cross:hover {
            background: rgba(239,68,68,0.25);
            border-color: var(--danger);
        }
        
        /* ─── HISTORY ─── */
        .history-card {
            flex: 1;
            min-height: 200px;
            overflow-y: auto;
        }
        
        .history-item {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            font-size: 12px;
        }
        
        .history-item:last-child {
            border-bottom: none;
        }
        
        .history-ticker {
            font-family: var(--font-mono);
            font-weight: 600;
            color: var(--accent);
            min-width: 50px;
        }
        
        .history-result {
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 11px;
            font-weight: 600;
        }
        
        .history-result.ok {
            background: rgba(34,197,94,0.2);
            color: var(--success);
        }
        
        .history-result.fail {
            background: rgba(239,68,68,0.2);
            color: var(--danger);
        }
        
        .history-pnl {
            font-family: var(--font-mono);
            font-weight: 600;
            min-width: 50px;
            text-align: right;
        }
        
        .history-pnl.positive { color: var(--success); }
        .history-pnl.negative { color: var(--danger); }
        
        /* ─── CHAT/DIARY ─── */
        .diary-panel {
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow: hidden;
        }
        
        .diary-messages {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .diary-message {
            background: rgba(20,184,166,0.08);
            border: 1px solid rgba(20,184,166,0.15);
            border-radius: 6px;
            padding: 8px 10px;
            font-size: 11px;
            line-height: 1.4;
        }
        
        .diary-timestamp {
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--text-secondary);
            margin-bottom: 3px;
        }
        
        .diary-text {
            color: var(--text-primary);
        }
        
        .diary-input-area {
            padding: 12px;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 6px;
        }
        
        .diary-input {
            flex: 1;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 8px 10px;
            color: var(--text-primary);
            font-family: var(--font-sans);
            font-size: 12px;
            resize: none;
            max-height: 60px;
        }
        
        .diary-send {
            padding: 8px 12px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
            font-size: 12px;
        }
        
        .diary-send:hover {
            background: #0fa898;
        }
        
        /* ─── TOASTS ─── */
        .toasts {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 9999;
        }
        
        .toast {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px 16px;
            min-width: 300px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: slideIn 0.3s ease-out;
        }
        
        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        
        .toast.success {
            border-left: 4px solid var(--success);
        }
        
        .toast.error {
            border-left: 4px solid var(--danger);
        }
        
        .toast.signal {
            border-left: 4px solid var(--accent);
            background: linear-gradient(135deg, rgba(20,184,166,0.1), rgba(20,184,166,0.05));
        }
        
        .toast-title {
            font-weight: 600;
            font-size: 13px;
            margin-bottom: 4px;
        }
        
        .toast-desc {
            font-size: 12px;
            color: var(--text-secondary);
        }
        
        /* ─── SCROLLBAR ─── */
        ::-webkit-scrollbar {
            width: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        
        ::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255,255,255,0.2);
        }
        
        /* ─── RESPONSIVE ─── */
        @media (max-width: 1024px) {
            .main-right {
                width: 280px;
            }
        }
        
        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                align-items: flex-start;
            }
            
            .main {
                flex-direction: column;
            }
            
            .main-right {
                width: 100%;
                height: 250px;
                border-left: none;
                border-top: 1px solid var(--border-color);
            }
        }
    </style>
</head>
<body>
    <div class="app">
        <!-- HEADER -->
        <header class="header">
            <div class="header-left">
                <div class="logo">
                    <div class="logo-icon">₳</div>
                    <span>MercadoAR</span>
                </div>
                <div class="connection-status">
                    <div class="status-dot" id="statusDot"></div>
                    <span id="statusText">Desconectado</span>
                </div>
            </div>
            
            <div class="header-controls">
                <div class="control-group">
                    <label>Timeframe</label>
                    <select id="tfSelect">
                        <option value="15m">15min</option>
                        <option value="30m">30min</option>
                        <option value="1h" selected>1h</option>
                        <option value="4h">4h</option>
                        <option value="1d">1d</option>
                    </select>
                </div>
                
                <div class="control-group">
                    <label>Indicadores</label>
                    <input type="checkbox" id="emaCheck" checked title="EMA">
                    <input type="checkbox" id="macdCheck" checked title="MACD">
                    <input type="checkbox" id="rsiCheck" checked title="RSI">
                </div>
                
                <button class="btn btn-primary" id="botBtn">
                    ▶ Iniciar Bot
                </button>
                
                <button class="btn btn-secondary" id="themeBtn">
                    🌙 Tema
                </button>
            </div>
        </header>
        
        <!-- MAIN CONTENT -->
        <div class="main">
            <div class="main-left">
                <!-- PREDICTIONS -->
                <div class="card predictions-card">
                    <div class="card-title">📊 Predicciones Activas</div>
                    <div id="predictionsContainer">
                        <div style="text-align: center; color: var(--text-secondary); padding: 20px; font-size: 12px;">
                            Conectando al bot...
                        </div>
                    </div>
                </div>
                
                <!-- HISTORY -->
                <div class="card history-card">
                    <div class="card-title">📈 Historial de Aciertos/Fallos</div>
                    <div id="historyContainer">
                        <div style="text-align: center; color: var(--text-secondary); padding: 20px; font-size: 12px;">
                            Sin historial aún
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- DIARY/CHAT PANEL -->
            <div class="main-right">
                <div class="diary-panel">
                    <div style="padding: 12px; border-bottom: 1px solid var(--border-color);">
                        <div class="card-title" style="margin: 0;">💭 Diario de Reportes</div>
                    </div>
                    <div class="diary-messages" id="diaryMessages"></div>
                    <div class="diary-input-area">
                        <textarea class="diary-input" id="diaryInput" placeholder="Escribe tu reporte aquí..." maxlength="500"></textarea>
                        <button class="diary-send" id="diarySend">✓</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- TOASTS -->
    <div class="toasts" id="toasts"></div>
    
    <script>
        // ═══════════════════════════════════════════════════════════════════════════
        // MERCADO AR v2.0 — FRONTEND FUNCIONAL
        // ═══════════════════════════════════════════════════════════════════════════
        
        const API_URL = 'http://localhost:8000';
        const WS_URL = 'ws://localhost:8765';
        
        let ws = null;
        let botRunning = false;
        let predictions = [];
        let history = JSON.parse(localStorage.getItem('marketHistory')) || [];
        let diary = JSON.parse(localStorage.getItem('tradingDiary')) || [];
        
        // ─── CONEXIÓN WebSocket ───
        function connectWebSocket() {
            try {
                ws = new WebSocket(WS_URL);
                
                ws.onopen = () => {
                    updateStatus('connected', 'Conectado');
                    showToast('success', '✓ Bot conectado', 'Sistema de trading activo');
                };
                
                ws.onmessage = (event) => {
                    try {
                        const data = JSON.parse(event.data);
                        if (data.type === 'prediction') {
                            addPrediction(data);
                        } else if (data.type === 'signal') {
                            showToast('signal', data.title || 'Nueva señal', data.desc || '');
                            if ('Notification' in window && Notification.permission === 'granted') {
                                new Notification(data.title, { body: data.desc });
                            }
                        } else if (data.type === 'update') {
                            // Actualización de datos en tiempo real
                            console.log('Datos actualizados:', data);
                        }
                    } catch (e) {
                        console.error('Error parsing WS message:', e);
                    }
                };
                
                ws.onerror = (error) => {
                    console.error('WS Error:', error);
                    updateStatus('disconnected', 'Error de conexión');
                };
                
                ws.onclose = () => {
                    updateStatus('disconnected', 'Desconectado');
                    setTimeout(connectWebSocket, 3000); // Reconectar cada 3s
                };
            } catch (e) {
                console.error('WebSocket connection failed:', e);
                updateStatus('disconnected', 'WebSocket no disponible');
            }
        }
        
        // ─── ESTADO ───
        function updateStatus(status, text) {
            const dot = document.getElementById('statusDot');
            const txtEl = document.getElementById('statusText');
            
            dot.classList.remove('connected', 'connecting');
            if (status === 'connected') {
                dot.classList.add('connected');
            } else if (status === 'connecting') {
                dot.classList.add('connecting');
            }
            
            txtEl.textContent = text;
        }
        
        // ─── BOT CONTROL ───
        async function toggleBot() {
            const btn = document.getElementById('botBtn');
            
            if (botRunning) {
                // Detener
                try {
                    await fetch(`${API_URL}/bot/stop`, { method: 'POST' });
                    botRunning = false;
                    btn.textContent = '▶ Iniciar Bot';
                    btn.classList.remove('running');
                    showToast('success', 'Bot detenido', '');
                } catch (e) {
                    showToast('error', 'Error', 'No se pudo detener el bot');
                }
            } else {
                // Iniciar
                const tf = document.getElementById('tfSelect').value;
                try {
                    updateStatus('connecting', 'Iniciando...');
                    const res = await fetch(`${API_URL}/bot/start`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ timeframe: tf })
                    });
                    
                    if (res.ok) {
                        botRunning = true;
                        btn.textContent = '⏹ Detener Bot';
                        btn.classList.add('running');
                        showToast('success', 'Bot iniciado', `Timeframe: ${tf}`);
                        updateStatus('connecting', 'Iniciando bot...');
                        
                        // Esperar a que se conecte
                        setTimeout(() => {
                            if (ws && ws.readyState === WebSocket.OPEN) {
                                updateStatus('connected', 'Conectado');
                            }
                        }, 1000);
                    } else {
                        showToast('error', 'Error', 'No se pudo iniciar el bot');
                    }
                } catch (e) {
                    showToast('error', 'Error de conexión', 'Asegúrate que el backend esté corriendo');
                    console.error(e);
                }
            }
        }
        
        // ─── PREDICCIONES ───
        function addPrediction(pred) {
            // Estructura esperada:
            // {
            //   type: 'prediction',
            //   id: unique_id,
            //   ticker: 'GGAL',
            //   signal: 'BUY' | 'SELL' | 'WATCH',
            //   message: 'En ~15 min EMA8 cruza EMA20',
            //   price: 4.82,
            //   confidence: 0.85,
            //   timestamp: '2024-...'
            // }
            
            // Evitar duplicados
            if (predictions.some(p => p.id === pred.id)) return;
            
            predictions.unshift(pred);
            renderPredictions();
            
            // Toast
            const signalText = {
                'BUY': '🟢 COMPRA',
                'SELL': '🔴 VENTA',
                'WATCH': '🟡 OBSERVAR'
            }[pred.signal] || pred.signal;
            
            showToast('signal', `${signalText} · ${pred.ticker}`, pred.message);
        }
        
        function renderPredictions() {
            const container = document.getElementById('predictionsContainer');
            
            if (predictions.length === 0) {
                container.innerHTML = '<div style="text-align: center; color: var(--text-secondary); padding: 20px; font-size: 12px;">Sin predicciones activas</div>';
                return;
            }
            
            container.innerHTML = predictions.map(p => {
                const signalClass = p.signal.toLowerCase();
                const signalEmoji = {
                    'buy': '🟢',
                    'sell': '🔴',
                    'watch': '🟡'
                }[signalClass] || '⚪';
                
                return `
                    <div class="prediction ${signalClass}" data-id="${p.id}">
                        <div class="prediction-header">
                            <div>
                                <div class="prediction-signal ${signalClass}">
                                    ${signalEmoji} ${p.signal}
                                </div>
                                <div style="margin-top: 4px; font-family: var(--font-mono); font-size: 14px; font-weight: 700;">
                                    ${p.ticker}
                                </div>
                            </div>
                            <div class="prediction-ticker">$${p.price.toFixed(2)}</div>
                        </div>
                        <div class="prediction-body">
                            ${p.message}
                        </div>
                        <div class="prediction-meta">
                            <div>
                                <span style="color: var(--accent);">Confianza: ${(p.confidence * 100).toFixed(0)}%</span>
                                <span style="margin-left: 12px;">${new Date(p.timestamp).toLocaleTimeString('es-AR')}</span>
                            </div>
                            <div class="prediction-actions">
                                <button class="btn-check" onclick="markPrediction('${p.id}', 'ok')">✓ Cumplida</button>
                                <button class="btn-cross" onclick="markPrediction('${p.id}', 'fail')">✗ Falló</button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        function markPrediction(predId, result) {
            const pred = predictions.find(p => p.id === predId);
            if (!pred) return;
            
            // Registrar en historial
            const now = new Date();
            const date = now.toLocaleDateString('es-AR', { day: '2-digit', month: 'short' }) + ', ' +
                        now.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
            
            // P&L simulado
            const pnl = (Math.random() * 1.8 + 0.2) * (result === 'ok' ? 1 : -1);
            const pnlStr = (pnl >= 0 ? '+' : '') + pnl.toFixed(2) + '%';
            
            const historyItem = {
                date,
                ticker: pred.ticker,
                signal: pred.signal,
                message: pred.message,
                price: pred.price,
                result, // 'ok' | 'fail'
                pnl: pnlStr,
                timestamp: now.toISOString()
            };
            
            history.unshift(historyItem);
            localStorage.setItem('marketHistory', JSON.stringify(history));
            
            // Remover de predicciones
            predictions = predictions.filter(p => p.id !== predId);
            renderPredictions();
            renderHistory();
            
            // Toast
            if (result === 'ok') {
                showToast('success', `Acierto: ${pred.ticker}`, `${pred.message} → ${pnlStr}`);
            } else {
                showToast('error', `Fallo: ${pred.ticker}`, `${pred.message} → ${pnlStr}`);
            }
        }
        
        // ─── HISTORIAL ───
        function renderHistory() {
            const container = document.getElementById('historyContainer');
            
            if (history.length === 0) {
                container.innerHTML = '<div style="text-align: center; color: var(--text-secondary); padding: 20px; font-size: 12px;">Sin historial aún</div>';
                return;
            }
            
            container.innerHTML = history.map(h => {
                const isPositive = !h.pnl.includes('-');
                return `
                    <div class="history-item">
                        <div class="history-ticker">${h.ticker}</div>
                        <div class="history-result ${h.result}">${h.result === 'ok' ? '✓ Acierto' : '✗ Fallo'}</div>
                        <div class="history-pnl ${isPositive ? 'positive' : 'negative'}">${h.pnl}</div>
                        <div style="font-size: 11px; color: var(--text-secondary);">${h.date}</div>
                    </div>
                `;
            }).join('');
        }
        
        // ─── DIARIO/CHAT ───
        function renderDiary() {
            const container = document.getElementById('diaryMessages');
            
            if (diary.length === 0) {
                container.innerHTML = '<div style="text-align: center; color: var(--text-secondary); padding: 20px; font-size: 12px;">Sin reportes aún</div>';
                return;
            }
            
            container.innerHTML = diary.map(msg => `
                <div class="diary-message">
                    <div class="diary-timestamp">${msg.date} · ${msg.time}</div>
                    <div class="diary-text">${msg.text}</div>
                </div>
            `).join('');
            
            // Auto scroll al último
            setTimeout(() => {
                container.scrollTop = container.scrollHeight;
            }, 0);
        }
        
        function sendDiaryMessage() {
            const input = document.getElementById('diaryInput');
            const text = input.value.trim();
            
            if (!text) return;
            
            const now = new Date();
            const date = now.toLocaleDateString('es-AR');
            const time = now.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
            
            diary.unshift({ date, time, text });
            localStorage.setItem('tradingDiary', JSON.stringify(diary));
            
            input.value = '';
            renderDiary();
            showToast('success', 'Reporte guardado', time);
        }
        
        // ─── TOASTS ───
        function showToast(type, title, desc) {
            const container = document.getElementById('toasts');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `
                <div class="toast-title">${title}</div>
                <div class="toast-desc">${desc}</div>
            `;
            
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.remove();
            }, 5000);
        }
        
        // ─── THEME ───
        function toggleTheme() {
            const html = document.documentElement;
            const current = html.getAttribute('data-theme') || 'dark';
            const next = current === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
        }
        
        // ─── EVENTOS ───
        document.getElementById('botBtn').addEventListener('click', toggleBot);
        document.getElementById('themeBtn').addEventListener('click', toggleTheme);
        document.getElementById('diarySend').addEventListener('click', sendDiaryMessage);
        document.getElementById('diaryInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && e.ctrlKey) {
                sendDiaryMessage();
            }
        });
        
        // ─── INIT ───
        window.addEventListener('DOMContentLoaded', () => {
            // Restaurar tema
            const theme = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', theme);
            
            // Conectar WebSocket
            connectWebSocket();
            
            // Mostrar historial y diario
            renderHistory();
            renderDiary();
            
            // Pedir permisos de notificación
            if ('Notification' in window && Notification.permission === 'default') {
                Notification.requestPermission();
            }
            
            // Intentar conectarse al API
            updateStatus('connecting', 'Conectando...');
        });
        
        // Pulso en el botón del bot cuando está corriendo
        setInterval(() => {
            if (botRunning && document.getElementById('botBtn').classList.contains('running')) {
                // Ya tiene la animación CSS
            }
        }, 1000);
    </script>
</body>
</html>
